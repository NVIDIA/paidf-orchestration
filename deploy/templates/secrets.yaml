{{- if and .Values.global.secrets .Values.global.secrets.ngcDockerRegistrySecret .Values.global.secrets.ngcDockerRegistrySecret.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ngc-docker-registry-secret
  labels:
    app.kubernetes.io/name: sdg-workflow-controller
    app.kubernetes.io/component: docker-registry-secret
    app.kubernetes.io/managed-by: helm
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}

{{/*
Generate docker config for NGC registry
*/}}
{{- define "imagePullSecret" }}
{{- with .Values.global.secrets.ngcDockerRegistrySecret }}
{{- $username := .username | default "$oauthtoken" }}
{{- $server := .server | default "nvcr.io" }}
{{- $email := .email | default "" }}
{{- printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" $server $username .password $email (printf "%s:%s" $username .password | b64enc) | b64enc }}
{{- end }}
{{- end }}

{{- if and .Values.global.secrets .Values.global.secrets.ngc .Values.global.secrets.ngc.ngcApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ngc-api-key-secret
  labels:
    app.kubernetes.io/component: ngc-api-key-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  ngc_api_key: {{ .Values.global.secrets.ngc.ngcApiKey }}

---
apiVersion: v1
kind: Secret
metadata:
  name: nvcf-connection-secret
  labels:
    app.kubernetes.io/component: nvcf-connection-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection: '{"conn_type": "http", "password": "{{ .Values.global.secrets.ngc.ngcApiKey }}"}'
{{- end }}

{{- if and 
    .Values.global.secrets
    .Values.global.secrets.aws
    .Values.global.secrets.aws.s3Output
    .Values.global.secrets.aws.s3Output.bucket
    .Values.global.secrets.aws.s3Output.region
    .Values.global.secrets.aws.s3Output.accessKey
    .Values.global.secrets.aws.s3Output.secretKey
    .Values.global.secrets.aws.s3Input
    .Values.global.secrets.aws.s3Input.bucket
    .Values.global.secrets.aws.s3Input.region
    .Values.global.secrets.aws.s3Input.accessKey
    .Values.global.secrets.aws.s3Input.secretKey
}}
---
{{/* Output bucket configuration (required) */}}
{{- $outputBucket := .Values.global.secrets.aws.s3Output.bucket -}}
{{- $outputRegion := .Values.global.secrets.aws.s3Output.region -}}
{{- $outputEndpoint := printf "https://s3.%s.amazonaws.com" $outputRegion -}}
{{- $outputAccessKey := .Values.global.secrets.aws.s3Output.accessKey -}}
{{- $outputSecretKey := .Values.global.secrets.aws.s3Output.secretKey -}}

{{/* Input bucket configuration (all fields required, including credentials) */}}
{{- $inputBucket := .Values.global.secrets.aws.s3Input.bucket -}}
{{- $inputRegion := .Values.global.secrets.aws.s3Input.region -}}
{{- $inputEndpoint := printf "https://s3.%s.amazonaws.com" $inputRegion -}}
{{- $inputAccessKey := .Values.global.secrets.aws.s3Input.accessKey -}}
{{- $inputSecretKey := .Values.global.secrets.aws.s3Input.secretKey -}}

apiVersion: v1
kind: Secret
metadata:
  name: multistorageclient-configuration-secret
  labels:
    app.kubernetes.io/component: multistorageclient-configuration-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  multistorageclient_configuration_secret: |-
    {
      "profiles": {
        "{{ $inputBucket }}": {
          "storage_provider": {
            "type": "s3",
            "options": {
              "base_path": "{{ $inputBucket }}",
              "region_name": "{{ $inputRegion }}",
              "endpoint_url": "{{ $inputEndpoint }}"
            }
          },
          "credentials_provider": {
            "type": "S3Credentials",
            "options": {
              "access_key": "{{ $inputAccessKey }}",
              "secret_key": "{{ $inputSecretKey }}"
            }
          }
        }
        {{- if or (ne $inputBucket $outputBucket) (ne $inputRegion $outputRegion) }},
        "{{ $outputBucket }}": {
          "storage_provider": {
            "type": "s3",
            "options": {
              "base_path": "{{ $outputBucket }}",
              "region_name": "{{ $outputRegion }}",
              "endpoint_url": "{{ $outputEndpoint }}"
            }
          },
          "credentials_provider": {
            "type": "S3Credentials",
            "options": {
              "access_key": "{{ $outputAccessKey }}",
              "secret_key": "{{ $outputSecretKey }}"
            }
          }
        }
        {{- end }}
      },
      "path_mapping": {
        "https://{{ $inputBucket }}.s3.{{ $inputRegion }}.amazonaws.com/": "msc://{{ $inputBucket }}/",
        "s3://{{ $inputBucket }}/": "msc://{{ $inputBucket }}/"
        {{- if or (ne $inputBucket $outputBucket) (ne $inputRegion $outputRegion) }},
        "https://{{ $outputBucket }}.s3.{{ $outputRegion }}.amazonaws.com/": "msc://{{ $outputBucket }}/",
        "s3://{{ $outputBucket }}/": "msc://{{ $outputBucket }}/"
        {{- end }}
      }
    }
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-remote-connection-secret
  labels:
    app.kubernetes.io/component: kubernetes-remote-connection-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.global.secrets.kubernetesRemote .Values.global.secrets.kubernetesRemote.kubeconfig }}
  connection: {{ printf "{\"conn_type\": \"kubernetes\", \"extra\": {\"kube_config\": %s, \"in_cluster\": false}}" (toJson .Values.global.secrets.kubernetesRemote.kubeconfig) | quote }}
  {{- else }}
  connection: '{"conn_type":"kubernetes","extra":{"in_cluster":true}}'
  {{- end }}


---
{{/*
Connection used by performance reporting to read a run's own task timings back from
the REST API. Task pods have no metadata-database access and their execution-API token
does not cover task instances, so this is the only route to per-task durations.
Credentials come from the account the chart already provisions, so no new secret
material is introduced here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-connection-secret
  labels:
    app.kubernetes.io/component: airflow-api-connection-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
{{- $defaultUser := ((((.Values).airflow).createUserJob).defaultUser) | default dict }}
stringData:
  connection: {{ printf "{\"conn_type\": \"http\", \"host\": \"%s-api-server\", \"schema\": \"http\", \"port\": 8080, \"login\": %s, \"password\": %s}" (include "sdg-workflow-controller.fullname" .) (toJson ($defaultUser.username | default "")) (toJson ($defaultUser.password | default "")) | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token-secret
  labels:
    app.kubernetes.io/component: hf-token-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.global.secrets .Values.global.secrets.huggingFace .Values.global.secrets.huggingFace.hfToken }}
  hf_token: {{ .Values.global.secrets.huggingFace.hfToken }}
  {{- else }}
  hf_token: ""
  {{- end }}

{{- if and 
      .Values.global.secrets 
      .Values.global.secrets.aws
      .Values.global.secrets.aws.s3Dag
      .Values.global.secrets.aws.s3Dag.bucket
      .Values.global.secrets.aws.s3Dag.region
      .Values.global.secrets.aws.s3Dag.accessKey
      .Values.global.secrets.aws.s3Dag.secretKey
      .Values.global.secrets.aws.s3Output
      .Values.global.secrets.aws.s3Output.bucket
      .Values.global.secrets.aws.s3Output.region
      .Values.global.secrets.aws.s3Output.accessKey
      .Values.global.secrets.aws.s3Output.secretKey
      .Values.global.secrets.aws.s3Input
      .Values.global.secrets.aws.s3Input.bucket
      .Values.global.secrets.aws.s3Input.region
      .Values.global.secrets.aws.s3Input.accessKey
      .Values.global.secrets.aws.s3Input.secretKey
}}
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials-secret
  labels:
    app.kubernetes.io/component: aws-credentials-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  aws_s3_dag_access_key_id: {{ .Values.global.secrets.aws.s3Dag.accessKey }}
  aws_s3_dag_secret_access_key: {{ .Values.global.secrets.aws.s3Dag.secretKey }}
  aws_s3_dag_region: {{ .Values.global.secrets.aws.s3Dag.region }}
  aws_s3_dag_bucket: {{ .Values.global.secrets.aws.s3Dag.bucket }}
  aws_s3_output_access_key_id: {{ .Values.global.secrets.aws.s3Output.accessKey }}
  aws_s3_output_secret_access_key: {{ .Values.global.secrets.aws.s3Output.secretKey }}
  aws_s3_output_region: {{ .Values.global.secrets.aws.s3Output.region }}
  aws_s3_output_bucket: {{ .Values.global.secrets.aws.s3Output.bucket }}
  aws_s3_input_access_key_id: {{ .Values.global.secrets.aws.s3Input.accessKey }}
  aws_s3_input_secret_access_key: {{ .Values.global.secrets.aws.s3Input.secretKey }}
  aws_s3_input_region: {{ .Values.global.secrets.aws.s3Input.region }}
  aws_s3_input_bucket: {{ .Values.global.secrets.aws.s3Input.bucket }}
{{- end }}

{{- if and (not .Values.airflow.postgresql.enabled) .Values.postgresql.auth.username .Values.postgresql.auth.password .Values.postgresql.auth.host .Values.postgresql.auth.port .Values.postgresql.auth.database }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sdg-workflow-db-secret
  labels:
    app.kubernetes.io/component: database-secret
    {{- include "sdg-workflow-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection: {{ printf "postgresql://%s:%s@%s:%s/%s?sslmode=%s" (.Values.postgresql.auth.username | urlquery) (.Values.postgresql.auth.password | urlquery) .Values.postgresql.auth.host (toString .Values.postgresql.auth.port) (.Values.postgresql.auth.database | urlquery) (.Values.postgresql.auth.sslmode | default "prefer" | urlquery) | quote }}
{{- end }}

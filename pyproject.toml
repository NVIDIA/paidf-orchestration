[project]
name = "sdg-workflow"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
# Extra runtime packages not already in apache/airflow:3.1.7-python3.11.
airflow-runtime = [
  "multi-storage-client==0.41.0",
  "pillow==12.2.0",
  "bracex==3.0",
  "lark==1.3.1",
  "prettytable==3.18.0",
  "wcmatch==10.2",
  "xattr==1.3.0",
]

[tool.uv]
package = false
default-groups = ["airflow-runtime"]
